<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Admin — Kitan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B10; --ink:#F4F2EE; --muted:#A6A2AD; --muted-2:#726E7A;
    --glass:rgba(255,255,255,0.045); --glass-border:rgba(255,255,255,0.09);
    --violet:#8C7CFF; --teal:#3FE0D6;
    --grad: linear-gradient(120deg, var(--violet), var(--teal));
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:14px;
    backdrop-filter:blur(18px); padding:32px; width:100%; max-width:420px;
  }
  h1{font-size:20px; font-weight:700; margin-bottom:6px;}
  p.sub{color:var(--muted); font-size:13.5px; margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); margin-bottom:7px;}
  .field input{
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--glass-border);
    border-radius:8px; padding:11px 13px; color:var(--ink); font-size:14px;
  }
  .field input:focus{outline:none; border-color:var(--teal);}
  button{
    width:100%; font-weight:600; font-size:14px; color:#0A0B10; background:var(--grad);
    border:none; padding:12px; border-radius:9px; cursor:pointer;
  }
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .error{color:#FF8A80; font-size:13px; margin-top:12px; font-family:'IBM Plex Mono', monospace;}

  /* Dashboard */
  #dashboard{display:none; max-width:900px; width:100%;}
  .dash-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .dash-header h1{font-size:22px;}
  .dash-header button{width:auto; padding:9px 18px; font-size:13px;}
  .msg-list{display:flex; flex-direction:column; gap:14px;}
  .msg-card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:12px;
    padding:20px; position:relative;
  }
  .msg-card.unread{border-color:var(--teal);}
  .msg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
  .msg-name{font-weight:600; font-size:15px;}
  .msg-email{color:var(--teal); font-size:13px; font-family:'IBM Plex Mono', monospace;}
  .msg-time{color:var(--muted-2); font-size:11.5px; font-family:'IBM Plex Mono', monospace; white-space:nowrap;}
  .msg-body{color:#D3D0DA; font-size:14px; line-height:1.6; margin-bottom:12px;}
  .msg-actions{display:flex; gap:10px;}
  .msg-actions button{
    width:auto; padding:7px 14px; font-size:12px; background:none;
    border:1px solid var(--glass-border); color:var(--muted);
  }
  .msg-actions button:hover{border-color:var(--teal); color:var(--teal);}
  .empty{color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:13.5px; text-align:center; padding:40px 0;}
</style>
</head>
<body>

<div class="card" id="login-card">
  <h1>Portfolio Admin</h1>
  <p class="sub">Sign in to view contact form submissions.</p>
  <form id="login-form">
    <div class="field">
      <label for="li-email">Email</label>
      <input type="email" id="li-email" required>
    </div>
    <div class="field">
      <label for="li-password">Password</label>
      <input type="password" id="li-password" required>
    </div>
    <button type="submit" id="li-submit">Sign in</button>
    <div class="error" id="li-error"></div>
  </form>
</div>

<div id="dashboard">
  <div class="dash-header">
    <h1>Messages</h1>
    <button id="logout-btn">Log out</button>
  </div>
  <div class="msg-list" id="msg-list">
    <div class="empty">Loading…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://ahnvhsynrthmpcfwxghp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFobnZoc3lucnRobXBjZnd4Z2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Mzk2NzMsImV4cCI6MjEwMTMxNTY3M30.gtD-53frjWEuwjlH4tpMMFGKHOa_aXbQneQVKXLOTds';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginCard = document.getElementById('login-card');
  const dashboard = document.getElementById('dashboard');
  const loginForm = document.getElementById('login-form');
  const liError = document.getElementById('li-error');
  const liSubmit = document.getElementById('li-submit');
  const msgList = document.getElementById('msg-list');

  async function showDashboard(){
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    await loadMessages();
  }

  async function loadMessages(){
    msgList.innerHTML = '<div class="empty">Loading…</div>';
    const { data, error } = await sb
      .from('contact_messages')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      msgList.innerHTML = '<div class="empty">Could not load messages: ' + error.message + '</div>';
      return;
    }
    if(!data || data.length === 0){
      msgList.innerHTML = '<div class="empty">No messages yet.</div>';
      return;
    }

    msgList.innerHTML = '';
    data.forEach(msg => {
      const card = document.createElement('div');
      card.className = 'msg-card' + (msg.read ? '' : ' unread');
      const when = new Date(msg.created_at).toLocaleString();
      card.innerHTML = `
        <div class="msg-top">
          <div>
            <div class="msg-name">${escapeHtml(msg.name)}</div>
            <div class="msg-email">${escapeHtml(msg.email)}</div>
          </div>
          <div class="msg-time">${when}</div>
        </div>
        <div class="msg-body">${escapeHtml(msg.message)}</div>
        <div class="msg-actions">
          ${msg.read ? '' : `<button data-id="${msg.id}" class="mark-read">Mark as read</button>`}
        </div>
      `;
      msgList.appendChild(card);
    });

    document.querySelectorAll('.mark-read').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        await sb.from('contact_messages').update({ read: true }).eq('id', id);
        loadMessages();
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    liSubmit.disabled = true;
    liSubmit.textContent = 'Signing in…';
    liError.textContent = '';

    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-password').value;

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if(error){
      liError.textContent = error.message;
      liSubmit.disabled = false;
      liSubmit.textContent = 'Sign in';
    } else {
      showDashboard();
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    dashboard.style.display = 'none';
    loginCard.style.display = 'block';
    liSubmit.disabled = false;
    liSubmit.textContent = 'Sign in';
  });

  // If already logged in (session persisted), skip straight to dashboard
  sb.auth.getSession().then(({ data }) => {
    if(data.session){
      showDashboard();
    }
  });
</script>

</body>
</html>
